<!DOCTYPE html>
<html>
<head>
    <title>Test Enrollment</title>
</head>
<body>

<h2>Test Course Enrollment</h2>

<form id="enrollForm">
    <label>Course ID:</label>
    <input type="text" id="course_id" value="c-2">

    <button type="submit">Enroll</button>
</form>

<pre id="result"></pre>

<script>
document.getElementById("enrollForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const formData = new FormData();

    formData.append(
        "course_id",
        document.getElementById("course_id").value
    );

   const response = await fetch("enroll.php", {
        method: "POST",
        body: formData
    });

    const data = await response.json();

    document.getElementById("result").textContent =
        JSON.stringify(data, null, 2);
});
</script>

</body>
</html>
