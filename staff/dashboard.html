<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Dashboard</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="dashboard">

        <!-- HEADER -->

        <header class="dashboard-header">

            <div>

                <h1>Staff Dashboard</h1>

                <p id="welcome"></p>

            </div>

            <button onclick="logout()">Logout</button>

        </header>


        <!-- STATISTICS -->

        <div class="stats">

            <div class="card">

                <h3>Assigned</h3>

                <p id="totalComplaints">0</p>

            </div>


            <div class="card">

                <h3>Pending</h3>

                <p id="pendingComplaints">0</p>

            </div>


            <div class="card">

                <h3>In Progress</h3>

                <p id="progressComplaints">0</p>

            </div>


            <div class="card">

                <h3>Resolved</h3>

                <p id="resolvedComplaints">0</p>

            </div>

        </div>


        <!-- ASSIGNED COMPLAINTS -->

        <div class="section">

            <h2>Assigned Complaints</h2>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Student</th>

                        <th>Subject</th>

                        <th>Category</th>

                        <th>Location</th>

                        <th>Status</th>

                        <th>Update</th>

                    </tr>

                </thead>


                <tbody id="complaintTable">

                </tbody>

            </table>

        </div>

    </div>


    <!-- UPDATE MODAL -->

    <div id="updateBox" class="update-box">

        <div class="update-content">

            <h2>Update Complaint</h2>

            <p id="selectedComplaint"></p>


            <label>Status</label>

            <select id="updateStatus">

                <option value="Pending">
                    Pending
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Resolved">
                    Resolved
                </option>

                <option value="Rejected">
                    Rejected
                </option>

            </select>


            <label>Response</label>

            <textarea
                id="responseText"
                rows="5"
                placeholder="Write your response..."
            ></textarea>


            <button onclick="saveUpdate()">
                Save Update
            </button>


            <button onclick="closeUpdateBox()">
                Cancel
            </button>


            <p id="updateMessage"></p>

        </div>

    </div>


    <script src="../js/check-session.js"></script>

    <script src="../js/logout.js"></script>

    <script src="../js/staff.js"></script>


    <script>

        checkSession("staff");

    </script>

</body>

</html>
