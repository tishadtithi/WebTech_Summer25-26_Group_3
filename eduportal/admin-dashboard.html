<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — EduPortal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">E</span> EduPortal</div>
    <div class="side-role">Admin menu</div>
    <nav class="side-nav">
      <a href="admin-dashboard.html" class="active">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="profile.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        My Profile
      </a>
    </nav>
    <div class="sidebar-foot">
      <button class="btn btn-outline btn-block" style="color:#cfd7ea; border-color:#3f4f78;" onclick="logout()">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Admin overview</h1>
        <div class="welcome" id="welcomeText"></div>
      </div>
      <div class="user-chip" id="userChip"></div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="value" id="statInstructors">0</div><div class="label">Instructors</div></div>
      <div class="stat-card"><div class="value" id="statStudents">0</div><div class="label">Students</div></div>
      <div class="stat-card"><div class="value" id="statCourses">0</div><div class="label">Courses</div></div>
      <div class="stat-card"><div class="value" id="statEnrollments">0</div><div class="label">Total enrollments</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Instructors</h2></div>
      <div id="instructorTableWrap"></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>All courses</h2></div>
      <div id="courseTableWrap"></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Students</h2></div>
      <div id="studentTableWrap"></div>
    </div>
  </main>
</div>

<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
