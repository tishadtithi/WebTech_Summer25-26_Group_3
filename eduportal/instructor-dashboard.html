<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instructor Dashboard — EduPortal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">E</span> EduPortal</div>
    <div class="side-role">Instructor menu</div>
    <nav class="side-nav">
      <a href="instructor-dashboard.html" class="active">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="profile.html">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        My Profile
      </a>
    </nav>
    <div class="sidebar-foot">
      <button class="btn btn-outline btn-block" style="color:#cfd7ea; border-color:#3f4f78;" onclick="logout()">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>My courses</h1>
        <div class="welcome" id="welcomeText"></div>
      </div>
      <div style="display:flex; gap:14px; align-items:center;">
        <div class="user-chip" id="userChip"></div>
        <button class="btn btn-primary" onclick="openCourseModal()">+ Add course</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="value" id="statCourses">0</div><div class="label">Courses published</div></div>
      <div class="stat-card"><div class="value" id="statStudents">0</div><div class="label">Total enrolled students</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Published courses</h2></div>
      <div id="courseList" class="course-grid"></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Enrolled students</h2></div>
      <div id="studentTableWrap"></div>
    </div>
  </main>
</div>

<!-- Add / Edit course modal -->
<div class="modal-backdrop" id="courseModalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Add a new course</h3>
      <button class="modal-close" onclick="closeCourseModal()">✕</button>
    </div>
    <form id="courseForm" novalidate>
      <input type="hidden" id="courseId">
      <div class="field">
        <label for="courseTitle">Course title</label>
        <input type="text" id="courseTitle" placeholder="e.g. Introduction to Web Technologies">
        <div class="field-error">Please enter a course title.</div>
      </div>
      <div class="field">
        <label for="courseCode">Course code</label>
        <input type="text" id="courseCode" placeholder="e.g. CSC3215">
        <div class="field-error">Please enter a course code.</div>
      </div>
      <div class="field">
        <label for="courseCategory">Category</label>
        <input type="text" id="courseCategory" placeholder="e.g. Computer Science">
        <div class="field-error">Please enter a category.</div>
      </div>
      <div class="field">
        <label for="courseDesc">Description</label>
        <textarea id="courseDesc" rows="3" placeholder="Short description of the course"></textarea>
        <div class="field-error">Please enter a short description.</div>
      </div>
      <div class="field">
        <label for="courseMaterials">Materials link (optional)</label>
        <input type="text" id="courseMaterials" placeholder="Link to slides / notes">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Save course</button>
    </form>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/instructor.js"></script>
</body>
</html>
